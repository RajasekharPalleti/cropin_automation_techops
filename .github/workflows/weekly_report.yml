name: Weekly Report

on:
  workflow_dispatch:
  schedule:
    - cron: '35 13 * * 5' # Runs at 13:35 UTC (7:05 PM IST) every Friday

jobs:
  run-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Create Configuration File
        run: |
          mkdir -p json_config
          echo '${{ secrets.WEEKLY_REPORT_CONFIG }}' > json_config/weekly_report_config.json
          
      - name: Execute Weekly Report
        run: python run_weekly_report.py
